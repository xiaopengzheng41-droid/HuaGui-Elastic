<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse Huagui Elastic products including men's and women's underwear waistbands, bra straps, binding, picot, knitted, and lingerie elastics.">
  <title>Huagui Elastic - Product Catalog</title>
  <link rel="stylesheet" href="assets/css/style.css?v=completion-20261029b">
</head>
<body>
  <div id="app">
    <main>
      <section class="section">
        <div class="container">
          <div class="catalog-toolbar">
            <div>
              <p class="section-label">Product Catalog</p>
              <h1>Elastic Webbing Products</h1>
              <p class="section-lead">Browse each product by its item number or original product name, then use the category and craft filters to narrow the catalog.</p>
            </div>
            <p class="product-count" id="productCount">13 elastic products</p>
          </div>

          <div class="filter-group">
            <h3>Main Categories</h3>
            <div class="filter-tabs" id="categoryTabs">
              <button class="filter-tab active" data-cat="all">All</button>
              <button class="filter-tab" data-cat="mens">Men's Underwear Elastics</button>
              <button class="filter-tab" data-cat="womens">Women's Underwear Elastics</button>
              <button class="filter-tab" data-cat="lingerie">Bra & Lingerie Elastics</button>
              <button class="filter-tab" data-cat="activewear">Activewear Elastics</button>
            </div>
          </div>

          <div class="filter-group">
            <h3>Product Tags</h3>
            <div class="filter-tabs" id="tagTabs">
              <button class="filter-tab active" data-tag="all">All Tags</button>
              <button class="filter-tab" data-tag="jacquard">Jacquard</button>
              <button class="filter-tab" data-tag="printed">Printed</button>
              <button class="filter-tab" data-tag="debossed">Debossed</button>
              <button class="filter-tab" data-tag="embossed">Embossed</button>
              <button class="filter-tab" data-tag="lurex">Lurex</button>
              <button class="filter-tab" data-tag="plain">Plain</button>
              <button class="filter-tab" data-tag="fold-over">Fold Over</button>
              <button class="filter-tab" data-tag="picot">Picot</button>
              <button class="filter-tab" data-tag="silicone-grip">Silicone Grip</button>
              <button class="filter-tab" data-tag="bra-strap">Bra Strap</button>
              <button class="filter-tab" data-tag="binding">Binding</button>
              <button class="filter-tab" data-tag="knitted">Knitted</button>
              <button class="filter-tab" data-tag="decorative-edge">Decorative Edge</button>
              <button class="filter-tab" data-tag="reflective">Reflective</button>
            </div>
          </div>

          <div class="products-grid" id="productsGrid"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/js/leaf-translations.js?v=completion-20261029b"></script>
  <script src="assets/js/page-translations.js?v=full-site-i18n-20261018bb"></script>
  <script src="assets/js/i18n.js?v=postlaunch-20261029a"></script>
  <script src="assets/js/analytics.js?v=postlaunch-20261029a"></script>
  <script src="assets/js/main.js?v=postlaunch-20261029a"></script>
</body>
</html>
